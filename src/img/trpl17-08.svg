<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Pin arkasındaki merhaba metni</title>
<desc id="desc">Pin, 7 baytlık merhaba metnini tutan String değerine işaret eder. Kesikli çerçeve, String türünün Unpin uyguladığını gösterir.</desc>
